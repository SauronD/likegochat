syntax = "proto3";

package auth;

option go_package = "./internal/common/proto/authpb;authpb";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterReply);
  rpc Login(LoginRequest) returns (LoginReply);
  rpc Verify(VerifyRequest) returns (VerifyReply);
  rpc Logout(LogoutRequest) returns (LogoutReply);
  rpc AddGroup(AddGroupRequest) returns (AddGroupReply);
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupReply);
}


message RegisterRequest {
  string username = 1;
  string password = 2;
}
message RegisterReply {
  int64 user_id = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  string ip = 3;
  string user_agent = 4;
}
message LoginReply {
  int64 user_id = 1;
  string session_id = 2;
  repeated SmallGroupInfo small_groups = 3;
}

message VerifyRequest {
  string session_id = 1;
}
message VerifyReply {
  int64 user_id = 1;
}

message LogoutRequest {
  string session_id = 1;
}

message LogoutReply {
  bool ok = 1;
}

message SmallGroupInfo {
  int64 group_id = 1;
  string group_name = 2;
  int32 member_count = 3;
}

message AddGroupRequest{
  int64 group_id=1;
  int64 user_id=2;
}

message AddGroupReply{
  bool ok=1;
}

message CreateGroupRequest{
  int64 user_id=1;
  string group_name=2;
}
message CreateGroupReply{
  int64 group_id=1;
}